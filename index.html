<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<link href="https://fonts.googleapis.com/css2?family=Darumadrop+One&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<style>

body{
margin:0;
background:transparent;
font-family:'Darumadrop One';
color:white;
}

.container{
width:420px;
padding:20px;
background:rgba(20,20,30,0.9);
border-radius:16px;
text-align:center;
transition: background 0.5s;
}

.overlay{
transition:opacity 0.8s;
}

.hidden{
opacity:0;
pointer-events:none;
}

.score{
display:flex;
justify-content:space-around;
font-size:64px;
margin-top:10px;
opacity:0;
transition:opacity 0.8s;
}

.show{
opacity:1;
}

.win{color:#1ec773;}
.lose{color:#e34a4a;}

.rate{
margin-top:10px;
font-size:22px;
opacity:0;
transition:opacity 0.8s;
}

.roomHistory{
font-size:14px;
margin-top:6px;
opacity:.7;
}

</style>

</head>

<body>

<div class="container">

<div id="overlay" class="overlay">

<div id="status">接続待ち…</div>
<div id="room"></div>
<div id="history" class="roomHistory"></div>

</div>

<div id="score" class="score">

<div class="win">
<div id="winLabel">勝ち</div>
<div id="win">0</div>
</div>

<div class="lose">
<div id="loseLabel">負け</div>
<div id="lose">0</div>
</div>

</div>

<div id="rate" class="rate">
勝率 <span id="rateNum">0%</span>
</div>

</div>

<script>

function randomRoom(){
return Math.random().toString(36).substr(2,6)
}

// ルームID自動管理
let room = localStorage.getItem('savedRoomId')
if (!room) {
  room = randomRoom()
  localStorage.setItem('savedRoomId', room)
} else {
  document.getElementById('status').textContent = '前回のルームで再接続中…'
}

// 前回ルームID表示
const lastRoom = localStorage.getItem('previousRoomId')
if(lastRoom && lastRoom !== room) {
  document.getElementById('history').textContent = '前回: ' + lastRoom
}

localStorage.setItem('previousRoomId', room)

document.getElementById('room').textContent = 'ルームID: ' + room

// ルームIDをコピーできるようにする
document.getElementById('room').addEventListener('click', () => {
  navigator.clipboard.writeText(room)
  alert('ルームIDをコピーしました: ' + room)
})

let win = 0
let lose = 0
let fontKey = 'darumadrop'
let backgroundColor = 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)'

const fontFamilies = {
  darumadrop: 'Darumadrop One, sans-serif',
  mincho: 'Hiragino Mincho ProN, "ＭＳ 明朝", serif'
}

function updateLabels(){
if(fontKey === 'mincho'){
 document.getElementById('winLabel').textContent = '勝'
 document.getElementById('loseLabel').textContent = '敗'
} else {
 document.getElementById('winLabel').textContent = 'かち'
 document.getElementById('loseLabel').textContent = 'まけ'
}
}

updateLabels()

function update(){

document.getElementById('win').textContent = win
document.getElementById('lose').textContent = lose

let total = win + lose
let rate = 0

if(total > 0){
rate = Math.round(win/total*100)
}

document.getElementById('rateNum').textContent = rate + '%'

}

function showCounter(){

const overlay = document.getElementById('overlay')

overlay.style.opacity = '0'

setTimeout(()=>{

overlay.style.display = 'none'

document.getElementById('score').classList.add('show')
document.getElementById('rate').classList.add('show')

}, 800)

}

const peer = new Peer()
let peerConn = null

peer.on('open', () => {
  document.getElementById('status').textContent = '接続待機中'
  
  // 自動接続
  peerConn = peer.connect(room)
  
  peerConn.on('open', () => {
    document.getElementById('status').textContent = '接続完了'
    setTimeout(showCounter, 1000)
  })
  
  peerConn.on('data', data => {
    win = data.win
    lose = data.lose
    if(data.font) {
      const selectedFont = data.font
      document.body.style.fontFamily = selectedFont
    }
    if(data.fontKey) {
      fontKey = data.fontKey
    }
    if(data.containerBackgroundColor) {
      backgroundColor = data.containerBackgroundColor
      document.querySelector('.container').style.background = backgroundColor
    }
    if(data.winColor) {
      document.querySelector('.win').style.color = data.winColor
    }
    if(data.loseColor) {
      document.querySelector('.lose').style.color = data.loseColor
    }
    updateLabels()
    update()
  })
  
  peerConn.on('error', err => {
    console.error('Connection error:', err)
    document.getElementById('status').textContent = 'エラー: ' + err.type
  })
})

peer.on('error', err => {
  console.error('Peer error:', err)
  document.getElementById('status').textContent = 'エラー: ' + err.type
})

</script>

</body>
</html>
