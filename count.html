<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<link href="https://fonts.googleapis.com/css2?family=Darumadrop+One&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<style>

body{
font-family:'Darumadrop One';
background:#111;
color:white;
text-align:center;
padding-top:80px;
}

input{
font-size:20px;
padding:10px;
border-radius:8px;
border:none;
text-align:center;
}

button{
font-size:22px;
padding:10px 20px;
margin:8px;
border:none;
border-radius:10px;
cursor:pointer;
}

.font-select{
font-size:18px;
padding:8px 12px;
margin-top:8px;
border-radius:8px;
border:none;
}

.win{background:#1ec773;color:black;}
.lose{background:#e34a4a;}
.reset{background:#555;color:white;}
.connect{background:#2c7be5;color:white;}
.pop{background:#ffaa00;color:black;}

.controls{
display:none;
margin-top:20px;
}

</style>

</head>

<body>

<h1>勝敗操作</h1>

<input id="roomInput" placeholder="ルームID">
<br>

<button class="connect" onclick="connectRoom()">接続</button>
<button class="pop" onclick="popup()">ポップアウト</button>

<div id="controls" class="controls">

<button class="win" onclick="addWin()">勝ち +1</button>
<button class="lose" onclick="addLose()">負け +1</button>
<button class="reset" onclick="subtractWin()">勝ち -1</button>
<button class="reset" onclick="subtractLose()">負け -1</button>
<button class="reset" onclick="reset()">リセット</button>

<select id="fontSelect" class="font-select" onchange="setFont(this.value)">
<option value="darumadrop">現在のフォント</option>
<option value="mincho">明朝体</option>
</select>

</div>

<script>

let win=0
let lose=0
let font='Darumadrop One, sans-serif'
let fontKey='darumadrop'
const fontFamilies={
darumadrop:'Darumadrop One, sans-serif',
mincho:'Hiragino Mincho ProN, "ＭＳ 明朝", serif'
}

let conn
const peer=new Peer()

function connectRoom(){

const room=document.getElementById("roomInput").value

conn=peer.connect(room)

conn.on("open",()=>{

document.getElementById("controls").style.display="block"
send()

})

}

function send(){

if(conn){
conn.send({win,lose,font,fontKey})
}

}

function addWin(){
win++
send()
}

function addLose(){
lose++
send()
}

function subtractWin(){
if(win>0) win--
send()
}

function subtractLose(){
if(lose>0) lose--
send()
}

function reset(){
win=0
lose=0
send()
}

function setFont(key){
const selectedFont=fontFamilies[key] || fontFamilies.darumadrop
fontKey=key
font=selectedFont
document.body.style.fontFamily=font
localStorage.setItem('selectedFont', key)
send()
}

const savedFont=localStorage.getItem('selectedFont')
if(savedFont){
document.getElementById('fontSelect').value=savedFont
}
setFont(document.getElementById('fontSelect').value)

function popup(){

window.open(
window.location.href,
"controlPanel",
"width=320,height=260"
)

}

</script>

</body>
</html>
